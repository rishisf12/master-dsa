<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1a2b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#020617"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: A compass/navigation - Essential = your true north -->
    
    <!-- Outer compass ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    
    <!-- Compass rose - 4 cardinal directions -->
    <g stroke="white" stroke-width="1.5" opacity="0.3">
      <line x1="0" y1="-85" x2="0" y2="-70"/>
      <line x1="85" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="85" x2="0" y2="70"/>
      <line x1="-85" y1="0" x2="-70" y2="0"/>
      <!-- Diagonals -->
      <line x1="-60" y1="-60" x2="-50" y2="-50"/>
      <line x1="60" y1="-60" x2="50" y2="-50"/>
      <line x1="60" y1="60" x2="50" y2="50"/>
      <line x1="-60" y1="60" x2="-50" y2="50"/>
    </g>
    
    <!-- Rotating needle - always points to "Essential" -->
    <g transform="rotate(-90)" filter="url(#glow)">
      <!-- Needle shape -->
      <path d="M 0 -65 L -4 0 L 4 0 Z" fill="url(#g)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </path>
      <!-- Needle tail -->
      <path d="M 0 8 L -2 0 L 2 0 Z" fill="white" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="url(#g)">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cardinal labels -->
    <g font-family="system-ui, sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.5">
      <text x="0" y="-72" font-weight="600">N</text>
      <text x="75" y="3" font-weight="600">E</text>
      <text x="0" y="78" font-weight="600">S</text>
      <text x="-75" y="3" font-weight="600">W</text>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" letter-spacing="5" opacity="0.9">ESSENTIAL</text>
    <text x="0" y="122" font-size="8" fill="white" text-anchor="middle" letter-spacing="2" opacity="0.35">YOUR TRUE NORTH</text>
  </g>
</svg>