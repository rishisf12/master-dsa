<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#052e16"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Progress bar filling up - minimal, clean, satisfying -->
    
    <!-- Background track -->
    <rect x="-80" y="-8" width="160" height="16" rx="8" fill="#064e3b" opacity="0.6"/>
    
    <!-- Animated progress fill -->
    <rect x="-80" y="-8" width="0" height="16" rx="8" fill="url(#g)">
      <animate attributeName="width" from="0" to="160" dur="2.5s" fill="freeze"/>
      <animate attributeName="fill" from="url(#g)" to="url(#g2)" begin="2.5s" dur="0.5s" fill="freeze"/>
    </rect>
    
    <!-- Percentage text -->
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
      <animate attributeName="textContent" from="0%" to="10%" to="25%" to="50%" to="75%" to="100%" dur="3s" begin="0" fill="freeze" calcMode="discrete"/>
    </text>
    
    <!-- Completion checkmark burst -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.5s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.8s" begin="3.5s" fill="freeze"/>
      <g stroke="url(#g2)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -30 0 L -10 20 L 30 -20" stroke-width="5">
          <animate attributeName="stroke-dasharray" from="0, 80" to="80, 0" dur="0.5s" fill="freeze"/>
        </path>
        <circle cx="0" cy="0" r="0" fill="url(#g2)">
          <animate attributeName="r" from="0" to="50" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="95" font-size="9" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">CHECK OFF WHAT MATTERS</text>
  </g>
</svg>