<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome version - works on any background -->
  <circle cx="100" cy="100" r="95" fill="black"/>
  
  <g transform="translate(100, 100)">
    <!-- Progress path -->
    <path d="M -40 0 Q 0 -20 40 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-dasharray" from="0, 120" to="120, 0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Progress dots -->
    <circle cx="-40" cy="0" r="4" fill="white">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-18" r="4" fill="white">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="40" cy="0" r="4" fill="white">
      <animate attributeName="opacity" values="0.2;0.2;1" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- E mark -->
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">E</text>
  </g>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="white" stroke-width="1" stroke-dasharray="5 10" opacity="0.4"/>
</svg>