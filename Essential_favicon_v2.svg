<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Card background -->
  <rect width="32" height="32" rx="4" fill="#064e3b"/>
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Checklist lines -->
  <g stroke="#10b981" stroke-width="0.3" opacity="0.2">
    <line x1="4" y1="9" x2="28" y2="9"/>
    <line x1="4" y1="16" x2="28" y2="16"/>
    <line x1="4" y1="23" x2="28" y2="23"/>
  </g>
  
  <!-- Checkboxes -->
  <g transform="translate(4, 3)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="5" height="5" rx="0.5" fill="none" stroke="white" stroke-width="0.8" opacity="0.8"/>
    <path d="M 0.5 2.5 L 1.5 3.5 L 4 0.5" stroke="white" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <text x="7" y="3.5" font-family="system-ui" font-size="2.5" font-weight="600" fill="white">✓</text>
    
    <!-- Item 2 -->
    <rect x="0" y="7" width="5" height="5" rx="0.5" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.9"/>
    <path d="M 0.5 9.5 L 1.5 10.5 L 4 7" stroke="url(#g2)" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="7" y="11" font-family="system-ui" font-size="2.5" font-weight="700" fill="url(#g2)">✓</text>
  </g>
  
  <!-- Bottom progress bar -->
  <rect x="3" y="28" width="26" height="1.5" rx="0.75" fill="white" opacity="0.15"/>
  <rect x="3" y="28" width="20" height="1.5" rx="0.75" fill="url(#g2)">
    <animate attributeName="width" from="0" to="20" dur="1.5s" fill="freeze"/>
  </rect>
</svg>