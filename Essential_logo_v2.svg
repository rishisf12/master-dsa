<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: subtle geometric pattern -->
  <rect width="200" height="200" fill="#0c1a2b"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#0ea5e9" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="20" x2="200" y2="20"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
  </g>

  <g transform="translate(100, 100)">
    <!-- Core concept: A key (essential = key) made of progress segments -->
    <g filter="url(#glow)">
      <!-- Key head: circular with progress ring -->
      <circle cx="-45" cy="0" r="28" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 30" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="-90 -45 0" to="270 -45 0" dur="8s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Key shaft: progress bar segments -->
      <rect x="-38" y="-4" width="80" height="8" rx="4" fill="url(#g2)" opacity="0.9">
        <animate attributeName="width" from="0" to="80" dur="2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Key teeth: 3 dots showing progress steps -->
      <circle cx="-20" cy="-4" r="3" fill="url(#g)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-4" r="3" fill="url(#g)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="20" cy="-4" r="3" fill="url(#g)">
        <animate attributeName="opacity" values="0.3;0.3;1" dur="1s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>

    <!-- Wordmark: ESSENTIAL -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.95">ESSENTIAL</text>
    
    <!-- Subtle tagline -->
    <text x="0" y="98" font-family="system-ui, sans-serif" font-size="9" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.5">THE KEY TO YOUR PROGRESS</text>
  </g>
</svg>