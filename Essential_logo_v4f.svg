<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#052e16"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Progress rings - minimal, modern, dashboard-style -->
    
    <!-- Background rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
    
    <!-- Ring 1: Classes (outer) -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="0, 534" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" from="0, 534" to="534, 0" dur="2s" fill="freeze"/>
    </circle>
    <text x="0" y="-78" font-family="system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle" opacity="0.7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>CLASSES
    </text>
    
    <!-- Ring 2: Assignments -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="0, 440" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" from="0, 440" to="440, 0" dur="1.8s" begin="0.5s" fill="freeze"/>
    </circle>
    <text x="0" y="-63" font-family="system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle" opacity="0.7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.8s" fill="freeze"/>ASSIGNMENTS
    </text>
    
    <!-- Ring 3: Exams -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="0, 345" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" from="0, 345" to="345, 0" dur="1.5s" begin="0.8s" fill="freeze"/>
    </circle>
    <text x="0" y="-48" font-family="system-ui" font-size="9" font-weight="600" fill="white" text-anchor="middle" opacity="0.7">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.2s" fill="freeze"/>EXAMS
    </text>
    
    <!-- Ring 4: Capstone (gold - inner, special) -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="0, 250" stroke-linecap="round" filter="url(#glow2)">
      <animate attributeName="stroke-dasharray" from="0, 250" to="250, 0" dur="1.5s" begin="1.2s" fill="freeze"/>
    </circle>
    <text x="0" y="-30" font-family="system-ui" font-size="9" font-weight="700" fill="url(#g2)" text-anchor="middle" opacity="0.8">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze">CAPSTONE</text>
    </text>
    
    <!-- Center: Overall progress -->
    <circle cx="0" cy="0" r="20" fill="url(#g)">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
    
    <!-- Center percentage -->
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
      <animate attributeName="textContent" from="0%" to="100%" dur="3s" begin="0" fill="freeze" calcMode="discrete"/>
    </text>
    
    <!-- Completion burst -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" begin="4s" fill="freeze"/>
      <g stroke="url(#g2)" stroke-width="4" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-50" stroke-width="4">
          <animate attributeName="stroke-dasharray" from="0, 60" to="60, 0" dur="0.5s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-35" y2="-35" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 55" to="55, 0" dur="0.4s" begin="0.1s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="35" y2="-35" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 55" to="55, 0" dur="0.4s" begin="0.2s" fill="freeze"/>
        </line>
        <circle cx="0" cy="0" r="0" fill="url(#g2)">
          <animate attributeName="r" from="0" to="40" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="115" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">CONCENTRIC PROGRESS</text>
  </g>
</svg>