<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="200" height="200" fill="url(#r)"/>
  
  <!-- Centered composition: A single line that completes itself -->
  <g transform="translate(100, 100)">
    <!-- The essential path: an incomplete circle that animates to completion -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="white" stroke-width="2" stroke-dasharray="200 200" stroke-dashoffset="0" stroke-linecap="round" opacity="0.15"/>
    
    <!-- Animated progress arc -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#g)" stroke-width="4" stroke-dasharray="250 150" stroke-dashoffset="0" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner completion arc - green when "done" -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#g2)" stroke-width="2" stroke-dasharray="100 300" stroke-dashoffset="0" stroke-linecap="round" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="-90 0 0" to="270 0 0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Central marker: a single dot at center = the essential point -->
    <circle cx="0" cy="0" r="4" fill="url(#g)">
      <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 4 cardinal markers = 4 quarters / semesters / quarters -->
    <g stroke="white" stroke-width="1.5" opacity="0.4">
      <line x1="0" y1="-80" x2="0" y2="-70"/>
      <line x1="80" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="80" x2="0" y2="70"/>
      <line x1="-80" y1="0" x2="-70" y2="0"/>
    </g>
    
    <!-- Wordmark at bottom -->
    <text x="0" y="85" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle" letter-spacing="6" opacity="0.85">ESSENTIAL</text>
  </g>
</svg>