<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22d3ee" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.5"/>

  <!-- Central "E" - bold, geometric -->
  <g transform="translate(100, 100)">
    <!-- Tracking path -->
    <path d="M -35 0 Q 0 -15 35 0" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dasharray" from="0, 100" to="100, 0" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Progress dots -->
    <circle cx="-35" cy="0" r="2.5" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-12" r="2.5" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="35" cy="0" r="2.5" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.3;0.8" dur="1.5s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <!-- Central "E" -->
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">E</text>
  </g>

  <!-- Progress ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 6" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>
</svg>