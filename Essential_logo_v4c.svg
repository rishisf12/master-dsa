<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#022c22"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Circular progress with checklist items around the ring -->
    
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    
    <!-- 4 quadrant checkpoints -->
    <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">
      
      <!-- Top: Classes -->
      <g transform="rotate(-90) translate(0, -75)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 88" to="88, 0" dur="0.5s" begin="0.2s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="0.7s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.8s" fill="freeze"/>
        </path>
        <text x="0" y="4" font-size="9" font-weight="600" fill="white" text-anchor="middle">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>Classes
        </text>
      </g>
      
      <!-- Right: Assignments -->
      <g transform="rotate(0) translate(75, 0)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 88" to="88, 0" dur="0.5s" begin="0.4s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="1.2s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.3s" fill="freeze"/>
        </path>
        <text x="0" y="4" font-size="9" font-weight="600" fill="white" text-anchor="middle">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>Assign.
        </text>
      </g>
      
      <!-- Bottom: Exams -->
      <g transform="rotate(90) translate(0, 75)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 88" to="88, 0" dur="0.5s" begin="0.6s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="1.7s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze"/>
        </path>
        <text x="0" y="4" font-size="9" font-weight="600" fill="white" text-anchor="middle">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2s" fill="freeze"/>Exams
        </text>
      </g>
      
      <!-- Left: Capstone (gold) -->
      <g transform="rotate(180) translate(0, 75)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 88" to="88, 0" dur="0.5s" begin="0.8s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g2)" dur="0.3s" begin="2.2s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="url(#g2)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2s" fill="freeze"/>
        </path>
        <text x="0" y="4" font-size="9" font-weight="700" fill="url(#g2)" text-anchor="middle">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>Capstone
        </text>
      </g>
    </g>
    
    <!-- Center progress ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="8 12" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Center completion % -->
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
      <animate attributeName="textContent" from="0%" to="25%" to="50%" to="75%" to="100%" dur="3s" begin="0" fill="freeze" calcMode="discrete"/>
    </text>
    
    <!-- Completion burst -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" begin="4s" fill="freeze"/>
      <g stroke="url(#g2)" stroke-width="4" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-55" stroke-width="4">
          <animate attributeName="stroke-dasharray" from="0, 65" to="65, 0" dur="0.5s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-35" y2="-35" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 55" to="55, 0" dur="0.4s" begin="0.1s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="35" y2="-35" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 55" to="55, 0" dur="0.4s" begin="0.2s" fill="freeze"/>
        </line>
        <circle cx="0" cy="0" r="0" fill="url(#g2)">
          <animate attributeName="r" from="0" to="40" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="120" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">CHECK OFF WHAT MATTERS</text>
  </g>
</svg>