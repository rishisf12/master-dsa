<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#r)"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: A growing plant/seedling = growth, progress, essential = nurturing growth -->
    
    <!-- Soil base -->
    <ellipse cx="0" cy="55" rx="60" ry="12" fill="#052e16" opacity="0.8"/>
    
    <!-- Roots (hidden but essential) -->
    <g stroke="#10b981" stroke-width="1.5" opacity="0.2">
      <line x1="-30" y1="55" x2="-35" y2="85"/>
      <line x1="-15" y1="55" x2="-15" y2="85"/>
      <line x1="0" y1="55" x2="0" y2="85"/>
      <line x1="15" y1="55" x2="15" y2="85"/>
      <line x1="30" y1="55" x2="35" y2="85"/>
    </g>
    
    <!-- Main stem - grows upward -->
    <g transform="translate(0, 55)">
      <path d="M 0 0 Q 0 -40 0 -70" stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <animate attributeName="stroke-dasharray" from="0, 100" to="100, 0" dur="2.5s" repeatCount="indefinite"/>
      </path>
      
      <!-- Leaves sprouting at different heights -->
      <g fill="url(#g)">
        <ellipse cx="-12" cy="-20" rx="10" ry="4" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
          <animateTransform attributeName="transform" type="rotate" from="-15 -12 -20" to="15 -12 -20" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="12" cy="-35" rx="10" ry="4" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
          <animateTransform attributeName="transform" type="rotate" from="15 12 -35" to="-15 12 -35" dur="3s" repeatCount="indefinite" begin="1s"/>
        </ellipse>
        <ellipse cx="-15" cy="-50" rx="12" ry="5" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
          <animateTransform attributeName="transform" type="rotate" from="-10 -15 -50" to="10 -15 -50" dur="4s" repeatCount="indefinite" begin="1.3s"/>
        </ellipse>
        <ellipse cx="15" cy="-65" rx="12" ry="5" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
          <animateTransform attributeName="transform" type="rotate" from="10 15 -65" to="-10 15 -65" dur="4s" repeatCount="indefinite" begin="1.6s"/>
        </ellipse>
        
        <!-- Top bud - not yet bloomed -->
        <ellipse cx="0" cy="-80" rx="8" ry="10" fill="url(#g)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" from="0.5 1" to="1 1" dur="0.5s" begin="2s" fill="freeze"/>
        </ellipse>
      </g>
    </g>
    
    <!-- Roots growing downward -->
    <g stroke="#10b981" stroke-width="1.5" opacity="0.3">
      <line x1="-20" y1="55" x2="-25" y2="85"/>
      <line x1="-10" y1="55" x2="-10" y2="85"/>
      <line x1="0" y1="55" x2="0" y2="85"/>
      <line x1="10" y1="55" x2="10" y2="85"/>
      <line x1="20" y1="55" x2="25" y2="85"/>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.9">ESSENTIAL</text>
    <text x="0" y="135" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">GROWTH FROM THE ROOTS</text>
  </g>
</svg>