<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="#022c22"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Minimal - just a single checkmark that builds itself -->
    
    <!-- The checkmark path -->
    <path d="M -45 0 L -10 35 L 45 -35" 
          stroke="url(#g)" stroke-width="8" fill="none" 
          stroke-linecap="round" stroke-linejoin="round" 
          stroke-dasharray="0, 130" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="0, 130" to="130, 0" dur="1.5s" fill="freeze"/>
      <animate attributeName="stroke" from="url(#g)" to="url(#g2)" begin="1.5s" dur="0.5s" fill="freeze"/>
    </path>
    
    <!-- Checkmark center dot -->
    <circle cx="0" cy="0" r="0" fill="url(#g)">
      <animate attributeName="r" from="0" to="8" dur="0.3s" begin="1.5s" fill="freeze"/>
    </circle>
    
    <!-- Progress ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#g)" stroke-width="2" 
            stroke-dasharray="0, 440" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0, 440" to="440, 0" dur="2s" fill="freeze"/>
    </circle>
    
    <!-- Percentage -->
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
      <animate attributeName="textContent" from="0%" to="100%" dur="2s" begin="0" fill="freeze" calcMode="discrete"/>
    </text>
    
    <!-- Wordmark -->
    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="95" font-size="9" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">DONE IS BETTER THAN PERFECT</text>
  </g>
</svg>