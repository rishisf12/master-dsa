<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#0f172a"/>
  
  <g transform="translate(100, 100)">
    <!-- Dark mode checklist card -->
    <g filter="url(#shadow)">
      <rect x="-85" y="-70" width="170" height="140" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
      <rect x="-80" y="-65" width="160" height="130" rx="16" fill="#0f172a" opacity="0.95" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    </g>
    
    <!-- Grid lines -->
    <g stroke="#10b981" stroke-width="0.5" opacity="0.1" stroke-dasharray="2 4">
      <line x1="-70" y1="-45" x2="70" y2="-45"/>
      <line x1="-70" y1="-10" x2="70" y2="-10"/>
      <line x1="-70" y1="25" x2="70" y2="25"/>
      <line x1="-70" y1="60" x2="70" y2="60"/>
    </g>

    <!-- Checklist items -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white">
      
      <!-- Item 1 -->
      <g transform="translate(-60, -40)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.2s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.8s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
          Classes
        </text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(-60, 8)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.4s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.3s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
          Assignments
        </text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(-60, 56)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.7s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#e2e8f0" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2s" fill="freeze"/>
          Exams
        </text>
      </g>

      <!-- Item 4 - Gold -->
      <g transform="translate(-60, 84)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.9s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>
          Capstone
        </text>
      </g>
    </g>

    <!-- Progress ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 10" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Percentage -->
    <text x="0" y="-98" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
      <animate attributeName="textContent" from="0%" to="25%" to="50%" to="75%" to="100%" dur="3s" begin="2.5s" fill="freeze" calcMode="discrete"/>
    </text>

    <!-- Celebration burst -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.5s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" begin="4.5s" fill="freeze"/>
      <g stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-50" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 60" to="60, 0" dur="0.5s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-35" y2="-35" stroke-width="2.5">
          <animate attributeName="stroke-dasharray" from="0, 50" to="50, 0" dur="0.4s" begin="0.1s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="35" y2="-35" stroke-width="2.5">
          <animate attributeName="stroke-dasharray" from="0, 50" to="50, 0" dur="0.4s" begin="0.2s" fill="freeze"/>
        </line>
        <circle cx="0" cy="0" r="0" fill="#fbbf24">
          <animate attributeName="r" from="0" to="30" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="130" font-size="8" fill="#94a3b8" text-anchor="middle" letter-spacing="3" opacity="0.5">CHECK OFF WHAT MATTERS</text>
  </g>
</svg>