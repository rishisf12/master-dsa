

services:
  postgres:
    image: postgres:15-alpine
    container_name: masterdsa_db
    environment:
      POSTGRES_USER: masterdsa
      POSTGRES_PASSWORD: masterdsa123
      POSTGRES_DB: masterdsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterdsa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - masterdsa_network

  adminer:
    image: adminer:latest
    container_name: masterdsa_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - masterdsa_network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  masterdsa_network:
    driver: bridge

volumes:
  postgres_data: