<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#052e16"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: A checklist that builds itself - each check is a win -->
    
    <!-- Card background with subtle depth -->
    <g filter="url(#shadow)">
      <rect x="-80" y="-70" width="160" height="140" rx="20" fill="#064e3b" opacity="0.9" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
      
      <!-- Subtle inner glow -->
      <rect x="-75" y="-65" width="150" height="130" rx="16" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Paper texture lines -->
    <g stroke="#10b981" stroke-width="0.5" opacity="0.1" stroke-dasharray="2 4">
      <line x1="-70" y1="-45" x2="70" y2="-45"/>
      <line x1="-70" y1="-10" x2="70" y2="-10"/>
      <line x1="-70" y1="25" x2="70" y2="25"/>
      <line x1="-70" y1="60" x2="70" y2="60"/>
    </g>

    <!-- Checklist items - animated with personality -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white">
      
      <!-- Item 1: Classes -->
      <g transform="translate(-60, -40)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.2s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="0.7s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.8s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g2)" dur="0.2s" begin="0.9s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
          Classes
        </text>
      </g>

      <!-- Item 2: Assignments -->
      <g transform="translate(-60, 8)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.3s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="1.2s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.3s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g2)" dur="0.2s" begin="1.4s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
          Assignments
        </text>
      </g>

      <!-- Item 3: Exams -->
      <g transform="translate(-60, 56)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.6s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g)" dur="0.3s" begin="1.7s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g2)" dur="0.2s" begin="1.9s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="white" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2s" fill="freeze"/>
          Exams
        </text>
      </g>

      <!-- Item 4: Projects (gold - the big goal) -->
      <g transform="translate(-60, 84)">
        <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.7">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="0.5s" begin="0.9s" fill="freeze"/>
          <animate attributeName="stroke" from="white" to="url(#g2)" dur="0.3s" begin="2.2s" fill="freeze"/>
        </circle>
        <path d="M -5 0 L -2 3 L 5 -6" stroke="url(#g2)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2s" fill="freeze"/>
        </path>
        <text x="22" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="url(#g2)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>
          Capstone
        </text>
      </g>
    </g>

    <!-- Progress ring around the card -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="100" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
      <circle cx="0" cy="0" r="95" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="5 10" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Completion percentage -->
      <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">
        <text x="0" y="-95" font-size="28" font-weight="800" fill="url(#g)" opacity="0">0%</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
        <animate attributeName="textContent" from="0%" to="25%" to="50%" to="75%" to="100%" dur="3s" begin="2.5s" fill="freeze" calcMode="discrete"/>
      </g>
    </g>

    <!-- Floating particles -->
    <g opacity="0.6">
      <circle cx="-80" cy="-80" r="2" fill="url(#g)" opacity="0">
        <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="0.5s" fill="freeze"/>
        <animate attributeName="cy" from="-90" to="-60" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" from="-80" to="-60" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="-60" r="1.5" fill="url(#g2)" opacity="0">
        <animate attributeName="opacity" from="0" to="0.5" dur="1s" begin="0.8s" fill="freeze"/>
        <animate attributeName="cy" from="-70" to "-40" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="80" r="1.5" fill="white" opacity="0">
        <animate attributeName="opacity" from="0" to="0.4" dur="1s" begin="1.2s" fill="freeze"/>
        <animate attributeName="cy" from="90" to="60" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Completion celebration burst (triggers at 100%) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.5s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" begin="4.5s" fill="freeze"/>
      <g stroke="url(#g2)" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-50" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 60" to="60, 0" dur="0.5s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-35" y2="-35" stroke-width="2.5">
          <animate attributeName="stroke-dasharray" from="0, 50" to="50, 0" dur="0.4s" begin="0.1s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="35" y2="-35" stroke-width="2.5">
          <animate attributeName="stroke-dasharray" from="0, 50" to="50, 0" dur="0.4s" begin="0.2s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-40" y2="10" stroke-width="2">
          <animate attributeName="stroke-dasharray" from="0, 45" to="45, 0" dur="0.3s" begin="0.15s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="40" y2="10" stroke-width="2">
          <animate attributeName="stroke-dasharray" from="0, 45" to="45, 0" dur="0.3s" begin="0.25s" fill="freeze"/>
        </line>
        <circle cx="0" cy="0" r="0" fill="url(#g2)">
          <animate attributeName="r" from="0" to="30" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="130" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">CHECK OFF WHAT MATTERS</text>
  </g>
</svg>