<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A magical journey for Jyoti">
  <meta name="theme-color" content="#ff6b9d">
  <title>For Jyoti ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen" role="status" aria-label="Loading your experience">
      <div class="loading-heart"></div>
      <p class="loading-text">Preparing something special for Jyoti...</p>
      <div class="loading-bar"><div class="loading-progress"></div></div>
    </div>

    <!-- Main Experience Container -->
    <main id="experience" class="experience" hidden>
      <!-- Progress Indicator -->
      <nav id="progress-nav" class="progress-nav" aria-label="Experience progress">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-dots" class="progress-dots" role="list"></div>
      </nav>

      <!-- Scene Container -->
      <div id="scene-container" class="scene-container">
        <!-- Scenes will be dynamically inserted here -->
      </div>

      <!-- Skip/Navigation Controls -->
      <div id="scene-controls" class="scene-controls" role="navigation" aria-label="Scene navigation">
        <button id="prev-btn" class="control-btn prev-btn" aria-label="Previous scene">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="scene-counter" aria-live="polite">
          <span id="current-scene">1</span> / <span id="total-scenes">0</span>
        </div>
        <button id="next-btn" class="control-btn next-btn" aria-label="Next scene">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </button>
        <button id="skip-btn" class="skip-btn" aria-label="Skip this scene">Skip</button>
      </div>

      <!-- Floating Action Buttons -->
      <div class="fab-group">
        <button id="music-toggle" class="fab" aria-label="Toggle music" aria-pressed="false">
          <svg class="icon-music-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <svg class="icon-music-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        </button>
        <button id="dashboard-btn" class="fab" aria-label="Open dashboard">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- Dashboard Modal -->
    <div id="dashboard-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dashboard-title" hidden>
      <div class="modal-backdrop" tabindex="-1"></div>
      <div class="modal-content dashboard-content">
        <header class="modal-header">
          <h2 id="dashboard-title">Dashboard - Jyoti's Journey</h2>
          <button class="modal-close" aria-label="Close dashboard">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <div class="dashboard-tabs" role="tablist">
            <button role="tab" aria-selected="true" data-tab="overview">Overview</button>
            <button role="tab" aria-selected="false" data-tab="thisorthat">This or That</button>
            <button role="tab" aria-selected="false" data-tab="flags">Green Flags</button>
            <button role="tab" aria-selected="false" data-tab="quiz">Quiz Result</button>
            <button role="tab" aria-selected="false" data-tab="addyours">Add Yours</button>
            <button role="tab" aria-selected="false" data-tab="yescard">Yes Card</button>
          </div>
          <div class="dashboard-panels">
            <div role="tabpanel" id="panel-overview" class="dashboard-panel active">
              <div class="stat-grid">
                <div class="stat-card">
                  <span class="stat-icon">❤️</span>
                  <div class="stat-info">
                    <span class="stat-value" id="stat-scenes-viewed">0</span>
                    <span class="stat-label">Scenes Viewed</span>
                  </div>
                </div>
                <div class="stat-card">
                  <span class="stat-icon">⏱️</span>
                  <div class="stat-info">
                    <span class="stat-value" id="stat-time-spent">0s</span>
                    <span class="stat-label">Time Spent</span>
                  </div>
                </div>
                <div class="stat-card">
                  <span class="stat-icon">💚</span>
                  <div class="stat-info">
                    <span class="stat-value" id="stat-green-flags">0</span>
                    <span class="stat-label">Green Flags</span>
                  </div>
                </div>
                <div class="stat-card">
                  <span class="stat-icon">✨</span>
                  <div class="stat-info">
                    <span class="stat-value" id="stat-interactions">0</span>
                    <span class="stat-label">Interactions</span>
                  </div>
                </div>
              </div>
              <div class="journey-timeline" id="journey-timeline"></div>
            </div>
            <div role="tabpanel" id="panel-thisorthat" class="dashboard-panel">
              <div id="thisorthat-results" class="results-list"></div>
            </div>
            <div role="tabpanel" id="panel-flags" class="dashboard-panel">
              <div id="flags-results" class="results-list"></div>
              <div class="flag-verdict" id="flag-verdict"></div>
            </div>
            <div role="tabpanel" id="panel-quiz" class="dashboard-panel">
              <div id="quiz-result" class="quiz-result-card"></div>
            </div>
            <div role="tabpanel" id="panel-addyours" class="dashboard-panel">
              <div id="addyours-submissions" class="submissions-list"></div>
            </div>
            <div role="tabpanel" id="panel-yescard" class="dashboard-panel">
              <div id="yes-card-status" class="yes-card-status"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
      <div class="modal-backdrop" tabindex="-1"></div>
      <div class="modal-content share-content">
        <header class="modal-header">
          <h2 id="share-title">Share Your Yes! 💍</h2>
          <button class="modal-close" aria-label="Close share options">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </header>
        <div class="modal-body">
          <div class="share-preview" id="share-preview"></div>
          <div class="share-actions">
            <button class="share-btn primary" id="download-card">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Download Card
            </button>
            <button class="share-btn secondary" id="share-native">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
              Share to Instagram
            </button>
            <button class="share-btn ghost" id="save-gallery">Save to Gallery</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop preload="auto">
      <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
