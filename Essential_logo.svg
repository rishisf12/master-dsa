<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#grad2)" stroke-width="3" opacity="0.6"/>

  <!-- Central icon: Minimalist "E" with tracking/path motif -->
  <g transform="translate(100, 100)">
    <!-- Tracking path - subtle curved line showing progress -->
    <path d="M -35 0 Q 0 -15 35 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-dasharray" from="0, 100" to="100, 0" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Progress dots on the path -->
    <circle cx="-35" cy="0" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="-12" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <circle cx="35" cy="0" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.3;0.8" dur="1.5s" repeatCount="indefinite" begin="1s" />
    </circle>
    
    <!-- Central "E" - minimal, geometric -->
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">E</text>
  </g>

  <!-- Subtle ring indicating completion/progress -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>