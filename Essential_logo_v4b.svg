<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#052e16"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Sticky notes / Post-its being checked off -->
    
    <!-- Stack of 4 sticky notes -->
    <g transform="translate(-70, -60)">
      <!-- Note 1 (bottom) -->
      <g transform="translate(-45, 30)" filter="url(#glow)">
        <rect x="-40" y="-25" width="80" height="50" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
        <rect x="-38" y="-22" width="76" height="44" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
        <text x="2" y="8" font-family="system-ui" font-size="11" font-weight="600" fill="url(#g)" text-anchor="middle">✓ Classes</text>
      </g>
      
      <!-- Note 2 -->
      <g transform="translate(-45, -20)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
        <rect x="-40" y="-25" width="80" height="50" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
        <rect x="-38" y="-22" width="76" height="44" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
        <text x="2" y="8" font-family="system-ui" font-size="11" font-weight="600" fill="white" text-anchor="middle">✓ Assignments</text>
      </g>
      
      <!-- Note 3 -->
      <g transform="translate(-45, -70)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
        <rect x="-40" y="-25" width="80" height="50" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
        <rect x="-38" y="-22" width="76" height="44" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
        <text x="2" y="8" font-family="system-ui" font-size="11" font-weight="600" fill="white" text-anchor="middle">✓ Exams</text>
      </g>
      
      <!-- Note 4 (top - gold) -->
      <g transform="translate(-45, -120)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.6s" fill="freeze"/>
        <rect x="-40" y="-25" width="80" height="50" rx="4" fill="#064e3b" stroke="url(#g2)" stroke-width="2" opacity="0.9"/>
        <rect x="-38" y="-22" width="76" height="44" rx="3" fill="#064e3b" stroke="url(#g2)" stroke-width="1.5" opacity="0.9"/>
        <text x="2" y="8" font-family="system-ui" font-size="11" font-weight="700" fill="url(#g2)" text-anchor="middle">✓ Capstone</text>
      </g>
    </g>
    
    <!-- Flying checkmarks when notes complete -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.8s" fill="freeze"/>
      <animate attributeName="opacity" from="1" to="0" dur="1s" begin="3.5s" fill="freeze"/>
      <g stroke="url(#g2)" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-60" stroke-width="4">
          <animate attributeName="stroke-dasharray" from="0, 70" to="70, 0" dur="0.4s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="-40" y2="-40" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 60" to="60, 0" dur="0.3s" begin="0.1s" fill="freeze"/>
        </line>
        <line x1="0" y1="0" x2="40" y2="-40" stroke-width="3">
          <animate attributeName="stroke-dasharray" from="0, 60" to="60, 0" dur="0.3s" begin="0.2s" fill="freeze"/>
        </line>
        <circle cx="0" cy="0" r="0" fill="url(#g2)">
          <animate attributeName="r" from="0" to="40" dur="0.4s" fill="freeze"/>
          <animate attributeName="opacity" from="1" to="0" dur="0.6s" begin="0.4s" fill="freeze"/>
        </circle>
      </g>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.95">ESSENTIAL</text>
    <text x="0" y="115" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.4">CHECK OFF WHAT MATTERS</text>
  </g>
</svg>