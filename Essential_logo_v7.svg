<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#0c0a1f"/>
  
  <g transform="translate(100, 100)">
    <!-- Concept: Neural network / connections = Essential = connections that matter -->
    
    <!-- Background nodes (subtle) -->
    <g opacity="0.1">
      <circle cx="-60" cy="-60" r="3" fill="white"/>
      <circle cx="60" cy="-60" r="3" fill="white"/>
      <circle cx="-60" cy="60" r="3" fill="white"/>
      <circle cx="60" cy="60" r="3" fill="white"/>
      <circle cx="0" cy="-80" r="2" fill="white"/>
      <circle cx="80" cy="0" r="2" fill="white"/>
      <circle cx="0" cy="80" r="2" fill="white"/>
      <circle cx="-80" cy="0" r="2" fill="white"/>
    </g>
    
    <!-- Main neural network - animated connections -->
    <g stroke="url(#g)" stroke-width="1.5" fill="none" filter="url(#glow)">
      <!-- Central hub -->
      <circle cx="0" cy="0" r="12" fill="url(#g)" opacity="0.8">
        <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 6 connections radiating out -->
      <g stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-65">
          <animate attributeName="stroke-dasharray" from="0, 65" to="65, 0" dur="1.5s" repeatCount="indefinite"/>
        </line>
        <line x1="0" y1="0" x2="56" y2="-32">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
        </line>
        <line x1="0" y1="0" x2="65" y2="0">
          <animate attributeName="stroke-dasharray" from="0, 65" to="65, 0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
        </line>
        <line x1="0" y1="0" x2="56" y2="32">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
        </line>
        <line x1="0" y1="0" x2="0" y2="65">
          <animate attributeName="stroke-dasharray" from="0, 65" to="65, 0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
        </line>
        <line x1="0" y1="0" x2="-56" y2="32">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
        </line>
        <line x1="0" y1="0" x2="-65" y2="0">
          <animate attributeName="stroke-dasharray" from="0, 65" to="65, 0" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
        </line>
        <line x1="0" y1="0" x2="-56" y2="-32">
          <animate attributeName="stroke-dasharray" from="0, 75" to="75, 0" dur="1.5s" repeatCount="indefinite" begin="1.4s"/>
        </line>
      </g>
      
      <!-- Outer nodes pulsing -->
      <g>
        <circle cx="0" cy="-65" r="5" fill="url(#g)">
          <animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="56" cy="-32" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
        </circle>
        <circle cx="65" cy="0" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="0.4s"/>
        </circle>
        <circle cx="56" cy="32" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="0.6s"/>
        </circle>
        <circle cx="0" cy="65" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="0.8s"/>
        </circle>
        <circle cx="-56" cy="32" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="1s"/>
        </circle>
        <circle cx="-65" cy="0" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="1.2s"/>
        </circle>
        <circle cx="-56" cy="-32" r="4" fill="white" opacity="0.7">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" begin="1.4s"/>
        </circle>
      </g>
      
      <!-- Central node - the "Essential" core -->
      <circle cx="0" cy="0" r="10" fill="url(#g)">
        <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6" fill="white" opacity="0.9"/>
    </g>
    
    <!-- Wordmark -->
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" letter-spacing="6" opacity="0.9">ESSENTIAL</text>
    <text x="0" y="115" font-size="8" fill="white" text-anchor="middle" letter-spacing="3" opacity="0.35">CONNECT WHAT MATTERS</text>
  </g>
</svg>